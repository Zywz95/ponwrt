name: Recover compiled release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download completed firmware archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42263696567
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Check expected artifacts and create checksums
        working-directory: release
        run: |
          test -s ponwrt-an7581.tar.zst
          test -s ponwrt-an7583.tar.zst
          sha256sum -- *.tar.zst > sha256sums

      - name: Publish existing build with fixed tag validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: upstream-03c134544714617e196dd399c85ebb90fb6eefa1
          PRERELEASE: 'true'
          BUILT_COMMIT: dd579610b116ced8536af4d9af3679d4c4bdd5df
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq '.[] | .ref' | { grep -Fx "$tag_ref" || test "$?" -eq 1; })"
          if [ -z "$existing_ref" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="$tag_ref" -f sha="$BUILT_COMMIT"
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [ "$tag_sha" != "$BUILT_COMMIT" ]; then
            echo "Release tag does not match the built commit" >&2
            exit 1
          fi

          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
